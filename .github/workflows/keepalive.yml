name: keepalive
# 保活：每 5 分钟 ping 一次授权服务器，防止 Render 免费实例休眠（15 分钟无流量会睡）
# 这个仓库是【公开】的 —— 公开仓库的 GitHub Actions 额度免费无限；
# 私有仓库每月只有 2000 分钟，每 5 分钟跑一次要 8640 分钟，会被 GitHub 直接砍调度。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping licsrv
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 65 "https://licsrv-fcld.onrender.com/" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "service is awake"
              exit 0
            fi
            sleep 15
          done
          echo "service did not respond"
          exit 1